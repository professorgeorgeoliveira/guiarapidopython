<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Cheatsheet PT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans flex flex-col md:flex-row transition-colors duration-300 min-h-screen">

    <button id="mobile-menu-btn" class="md:hidden fixed top-4 left-4 z-50 p-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg text-slate-800 dark:text-white">
        <i data-lucide="menu"></i>
    </button>

    <div id="mobile-overlay" class="hidden md:hidden fixed inset-0 bg-black/60 z-30 backdrop-blur-sm"></div>

    <aside id="sidebar" class="fixed md:sticky top-0 left-0 h-screen w-64 bg-white dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-xl md:shadow-none">
        <div class="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-blue-500 to-yellow-500 flex items-center justify-center font-bold text-white shadow-lg">Py</div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-yellow-600 dark:from-blue-400 dark:to-yellow-500">Cheatsheet</h1>
            </div>
            <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" title="Alternar Tema">
                <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="p-4 flex-grow overflow-y-auto custom-scrollbar">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 px-2">Conteúdo</p>
            <nav id="nav-menu" class="space-y-1">
                </nav>
        </div>
        
        <div class="p-4 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 text-center">
            Inspirado em QuickRef.me<br/>Com base na Aula 5 (IFRR)
        </div>
    </aside>

    <main class="flex-1 h-screen overflow-y-auto bg-slate-50 dark:bg-slate-900 scroll-smooth pb-24">
        
        <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 p-4 md:px-8 py-6 flex flex-col md:flex-row gap-4 justify-between items-center pl-16 md:pl-8 transition-colors duration-300">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Guia Rápido Python</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">Referência interativa de programação em Python 3.</p>
            </div>
            
            <div class="relative w-full md:w-80">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 w-4 h-4"></i>
                <input type="text" id="search-input" placeholder="Pesquisar comandos, funções..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all placeholder-slate-400 dark:placeholder-slate-500">
            </div>
        </header>

        <div id="content-container" class="p-4 md:p-8 max-w-7xl mx-auto">
            </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
